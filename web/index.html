<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>项目Git · 团队知识的时间轴</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">⎇</span> 项目Git</div>
  <div class="search-wrap">
    <input id="search" placeholder="搜节点、搜段落、搜状态…   （ / 聚焦）" autocomplete="off" />
    <div id="search-hint" class="search-hint"></div>
  </div>
  <select id="filter-type" class="filter"><option value="">全部类型</option></select>
  <select id="filter-status" class="filter">
    <option value="">全部状态</option>
    <option value="active">有效</option>
    <option value="superseded">已取代</option>
  </select>
  <button id="btn-edit" class="btn">调整模式 <kbd>E</kbd></button>
  <button id="btn-capture" class="btn">＋ 收进来</button>
  <button id="btn-queue" class="btn queue">待归类 <span id="queue-count">0</span></button>
  <button id="btn-type" class="btn ghost">＋ 新建类型</button>
  <button id="btn-git" class="btn ghost">接 git</button>
  <div class="stats"><span id="stat-nodes">0</span> 节点 · <span id="stat-projects">0</span> 项目</div>
</header>

<main id="stage">
  <canvas id="canvas"></canvas>
  <div id="tip" class="tip"></div>
  <div id="minimap-wrap"><canvas id="minimap" width="180" height="110"></canvas></div>
  <div id="queue-panel" class="panel hidden">
    <div class="panel-h">待归类 <span class="muted">（AI 拿不准的，都在这儿，不会丢）</span></div>
    <div id="queue-list" class="panel-body"></div>
  </div>
</main>

<aside id="drawer" class="drawer hidden">
  <div class="drawer-h">
    <div>
      <h3 id="d-title">—</h3>
      <div id="d-meta" class="muted"></div>
    </div>
    <button id="d-close" class="icon">✕</button>
  </div>
  <div id="d-body" class="drawer-body"></div>
</aside>

<footer class="tracebar">
  <div id="trace" class="trace">① 输入任意内容 → ② 自动归位 → ③ 时间轴生长　｜　试着搜索「定价」</div>
  <button id="trace-toggle" class="btn ghost small">展开</button>
</footer>

<!-- 收进来 -->
<div id="modal-capture" class="modal hidden">
  <div class="modal-box">
    <h3>收进来</h3>
    <p class="muted">把群聊、纪要、邮件正文粘进来。带「说话人 时间」的行会被切成独立条目。</p>
    <textarea id="capture-text" rows="9" placeholder="张三 2026-11-19 10:12&#10;定价就按 B 方案走吧，A 的风险太大&#10;李四 2026-11-19 10:13&#10;同意，明天同步给运营"></textarea>
    <div class="row">
      <label class="muted">内容日期 <input id="capture-date" type="date" /></label>
      <div class="spacer"></div>
      <button class="btn ghost" data-close>取消</button>
      <button id="capture-go" class="btn primary">开始归位</button>
    </div>
  </div>
</div>

<!-- 归位弹窗 -->
<div id="modal-place" class="modal hidden">
  <div class="modal-box">
    <h3>这条挂到哪儿？</h3>
    <div id="place-text" class="quote"></div>
    <div id="place-cands" class="cands"></div>
    <input id="place-custom" placeholder="都不是，我自己指定（输入节点标题）" />
    <div class="row">
      <button class="btn ghost" data-close>暂缓</button>
      <div class="spacer"></div>
      <button id="place-confirm" class="btn primary">挂上去</button>
    </div>
  </div>
</div>

<!-- 新建类型 -->
<div id="modal-type" class="modal hidden">
  <div class="modal-box">
    <h3>新建节点类型</h3>
    <p class="muted">字段名用中文就行，AI 会按你定的字段抽取。</p>
    <input id="type-name" placeholder="类型名称，例如：实验结果" />
    <div id="type-fields" class="fields"></div>
    <button id="type-add-field" class="btn ghost small">＋ 加一个字段</button>
    <div class="row">
      <button class="btn ghost" data-close>取消</button>
      <div class="spacer"></div>
      <button id="type-save" class="btn primary">创建</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
