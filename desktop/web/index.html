<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>项目Git</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">项目Git</div>
  <nav id="tabs" class="tabs"></nav>
  <div class="search-wrap">
    <input id="search" placeholder="搜索节点、段落、状态…" spellcheck="false" />
    <div id="search-hint" class="search-hint"></div>
  </div>
  <div class="spacer"></div>
  <button id="btn-capture" class="btn primary">收进来</button>
  <button id="btn-queue" class="btn ghost">待归类 <b id="queue-count">0</b></button>
  <button id="btn-edit" class="btn ghost">调整</button>
  <button id="btn-type" class="btn ghost">类型</button>
  <button id="btn-git" class="btn ghost">接 git</button>
</header>

<div id="main">
  <aside id="nav" class="nav">
    <div class="nav-h"><span>脉络</span><button id="nav-toggle" class="icon">‹</button></div>
    <div class="nav-body">
      <div class="nav-stats" id="nav-stats"></div>
      <div class="nav-sec"><div class="nav-sec-h">主线</div><div id="nav-spine" class="nav-list"></div></div>
      <div class="nav-sec"><div class="nav-sec-h">支线与证据</div><div id="nav-branch" class="nav-list"></div></div>
      <div class="nav-sec"><div class="nav-sec-h">待归类</div><div id="nav-queue" class="nav-list"></div></div>
    </div>
  </aside>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="tip" class="tip"></div>
    <div class="legend" id="legend"></div>
    <div class="zoombar">
      <button id="z-in">＋</button><button id="z-out">－</button><button id="z-fit">⤢</button>
    </div>
    <div id="empty" class="empty hidden">这个项目还没有节点。<br><span>点右上角「收进来」粘一段群聊试试。</span></div>
  </div>

  <aside id="drawer" class="drawer hidden">
    <div class="drawer-h">
      <div style="min-width:0"><h3 id="d-title">—</h3><div id="d-meta" class="muted"></div></div>
      <button id="d-close" class="icon">✕</button>
    </div>
    <div id="d-body" class="drawer-body"></div>
  </aside>
</div>

<footer class="statusbar">
  <div id="trace" class="trace">就绪　·　输入任意内容 → 自动归位 → 长到图上</div>
  <div class="status-right"><span id="stat-count"></span></div>
</footer>

<div id="modal-capture" class="modal hidden">
  <div class="modal-box">
    <h3>收进来</h3>
    <p class="muted">粘群聊、纪要、邮件正文。带「说话人 + 时间」的行会被切成独立条目。</p>
    <textarea id="capture-text" rows="9" placeholder="张三 2026-11-19 10:12&#10;定价就按 B 方案走吧，A 的风险太大&#10;李四 2026-11-19 10:30&#10;同意，明天同步给运营"></textarea>
    <div class="row">
      <label class="muted">日期 <input id="capture-date" type="date" /></label>
      <div class="spacer"></div>
      <button class="btn ghost" data-close>取消</button>
      <button id="capture-go" class="btn primary">开始归位</button>
    </div>
  </div>
</div>

<div id="modal-place" class="modal hidden">
  <div class="modal-box">
    <h3>这条挂到哪儿？</h3>
    <div id="place-text" class="quote"></div>
    <div id="place-why" class="muted"></div>
    <div id="place-cands" class="cands"></div>
    <input id="place-custom" placeholder="都不是，我自己指定（输入新节点标题）" />
    <div class="row">
      <button class="btn ghost" data-close>暂缓</button>
      <div class="spacer"></div>
      <button id="place-confirm" class="btn primary">挂上去</button>
    </div>
  </div>
</div>

<div id="modal-type" class="modal hidden">
  <div class="modal-box">
    <h3>新建节点类型</h3>
    <p class="muted">字段名用中文就行，AI 会按你定的字段抽取。</p>
    <input id="type-name" placeholder="类型名称，例如：实验结果" />
    <div id="type-fields" class="fields"></div>
    <button id="type-add-field" class="btn ghost small">＋ 加一个字段</button>
    <div class="row">
      <button class="btn ghost" data-close>取消</button>
      <div class="spacer"></div>
      <button id="type-save" class="btn primary">创建</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="./vendor/d3.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
