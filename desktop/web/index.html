<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>项目Git</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<header class="bar">
  <div class="brand">项目Git</div>
  <nav id="tabs" class="tabs"></nav>
  <div class="grow"></div>
  <input id="search" class="search" placeholder="搜索" spellcheck="false" />
  <button id="btn-set" class="btn" title="设置">⚙</button>
  <button id="btn-ask" class="btn">问一问</button>
  <button id="btn-capture" class="btn">收进来</button>
  <div id="search-hint" class="hint"></div>
</header>

<canvas id="c"></canvas>

<div id="panel" class="panel hidden">
  <button id="p-close" class="close">✕</button>
  <h2 id="p-title"></h2>
  <div id="p-meta" class="meta"></div>
  <div id="p-body" class="body"></div>
</div>

<div id="modal" class="modal hidden">
  <div class="box">
    <h3>收进来</h3>
    <textarea id="m-text" rows="8" placeholder="把群聊、纪要粘进来。带「说话人 时间」的行会拆成独立条目。"></textarea>
    <div class="row">
      <input id="m-date" type="date" />
      <div class="grow"></div>
      <button class="btn ghost" data-close>取消</button>
      <button id="m-go" class="btn primary">确定</button>
    </div>
  </div>
</div>

<div id="preview" class="preview hidden">
  <div class="pv-head">
    <div class="pv-name" id="pv-name">—</div>
    <button id="pv-extern" class="btn ghost small">外部打开</button>
    <button id="pv-close" class="close">✕</button>
  </div>
  <div id="pv-body" class="pv-body"></div>
</div>

<div id="ask" class="ask hidden">
  <div class="ask-head">
    <div class="ask-title">问一问</div>
    <button id="ask-close" class="close">✕</button>
  </div>
  <div class="ask-bar">
    <input id="ask-input" placeholder="例如：为什么放弃 HID？现在还有效吗？" spellcheck="false" />
    <button id="ask-go" class="btn primary small">问</button>
  </div>
  <div id="ask-hintline" class="ask-hint"></div>
  <div id="ask-body" class="ask-body">
    <div class="ask-empty">问团队里的任意一件事：为什么这么定、后来怎么样了、原文在哪。</div>
  </div>
</div>

<div id="set" class="modal hidden">
  <div class="box">
    <h3>设置</h3>
    <div class="set-row"><label>接口地址</label><input id="set-base" placeholder="https://api.deepseek.com/v1" /></div>
    <div class="set-row"><label>模型</label><input id="set-model" placeholder="deepseek-chat" /></div>
    <div class="set-row"><label>API Key</label><input id="set-key" type="password" placeholder="sk-..." /></div>
    <div class="set-tip" id="set-tip">未配置时使用本地规划器（离线可用，准确率较低）</div>
    <div class="set-sep"></div>
    <div class="set-row"><label>项目管理</label>
      <input id="set-newproj" placeholder="新项目名称，回车创建" />
      <button class="btn ghost small" id="set-newgo">新建</button>
    </div>
    <div class="set-actions">
      <button class="btn ghost small" id="set-delproj">删除当前项目</button>
      <button class="btn ghost small" id="set-clear">清空所有数据</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="set-export">导出当前图为 PNG</button>
      <button class="btn ghost" id="set-reset">重置演示数据</button>
      <div class="grow"></div>
      <button class="btn ghost" data-set-close>取消</button>
      <button class="btn primary" id="set-save">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="./vendor/d3.min.js"></script>
<script src="./vendor/marked.min.js"></script>
<script src="./vendor/pdf.min.js"></script>
<script src="./vendor/mammoth.browser.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
